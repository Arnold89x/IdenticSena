<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estudiante</title>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>

<body>

<div class="form-container">

    <h2 th:text="${estudiante.id != null} ? 'Editar estudiante' : 'Registrar estudiante'"></h2>

    <form th:action="@{/admin/guardar}" method="post" th:object="${estudiante}">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Tipo de documento:</label>
            <select th:field="*{tipoDocumento}" required>
                <option value="">Seleccione</option>
                <option value="cc">Cédula de ciudadanía</option>
                <option value="ti">Tarjeta de identidad</option>
                <option value="ce">Cédula de extranjería</option>
                <option value="pp">Pasaporte</option>
            </select>
        </div>

        <div class="form-group">
            <label>Número Documento</label>
            <input type="text" th:field="*{numeroDocumento}" required>
        </div>

        <div class="form-group">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" required>
        </div>

        <div class="form-group">
            <label>Apellido</label>
            <input type="text" th:field="*{apellido}" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="contrasena" placeholder="(solo si quieres cambiarla)">
        </div>

        <div class="form-group">
            <label>Confirmar contraseña</label>
            <input type="password" id="confirmarContrasena" placeholder="Confirmar contraseña">
        </div>

        <div class="form-group">
            <label>Teléfono</label>
            <input type="text" th:field="*{telefono}">
        </div>

        <div class="form-group">
            <label>Edad</label>
            <input type="number" th:field="*{edad}">
        </div>

        <button type="submit" class="btn">
            Guardar estudiante
        </button>

        <a th:href="@{/admin/dashboard}">Volver</a>

    </form>

</div>
<script>
    document.querySelector("form").addEventListener("submit", function (e) {
        const pass = document.querySelector("input[name='contrasena']").value;
        const confirm = document.getElementById("confirmarContrasena").value;

        if (pass && pass !== confirm) {
            e.preventDefault();
            alert("Las contraseñas no coinciden");
        }
    });
</script>
</body>
</html>
