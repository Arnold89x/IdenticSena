<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <title>DashBoard</title>
</head>

<body>

<div class="header">

    <div class="welcome">
        Bienvenido: <strong sec:authentication="principal.username"></strong>
    </div>
    <a class="btn btn-delete" th:href="@{/login?logout}" onclick="return confirm('¿Esta seguro que desea cerrar sesion?');">Cerrar sesion</a>
</div>

<a class="btn btn-primary" th:href="@{/admin/nuevo}">+ Nuevo estudiante</a>

<table>

    <thead>
    <tr>
        <th>ID</th>
        <th>Tipo Doc</th>
        <th>Documento</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
        <th>Edad</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="estudiante : ${estudiantes}">

        <td th:text="${estudiante.id}"></td>
        <td th:text="${estudiante.tipoDocumento}"></td>
        <td th:text="${estudiante.numeroDocumento}"></td>
        <td th:text="${estudiante.nombre}"></td>
        <td th:text="${estudiante.apellido}"></td>
        <td th:text="${estudiante.email}"></td>
        <td th:text="${estudiante.edad}"></td>

        <td class="actions">
            <a class="btn btn-edit" th:href="@{/admin/editar/{id}(id=${estudiante.id})}">Editar</a>
            <a class="btn btn-delete" th:href="@{/admin/eliminar/{id}(id=${estudiante.id})}" onclick="return confirm('¿Eliminar este estudiante?');">Eliminar</a>
        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
