spring.application.name=identic
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/identic
spring.datasource.driver=ClassName=org.h2.driver
spring.datasource.username=root
spring.datasource.pasword=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
#create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sal=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

logging.level.org.hibernate.SQL=DEBUG
loggin.level.org.hibernate.type=TRACE

spring.h2.console.enable=true
spring.h2.console.path=/h2-console